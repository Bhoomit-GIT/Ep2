<svg class="stamp" width="179" height="140" viewBox="0 0 179 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Text Paths for top and bottom arcs -->
    <path id="stampArcTop" d="M 22 70 A 68 52 0 0 1 157 70" fill="none" />
    <path id="stampArcBottom" d="M 157 70 A 68 52 0 0 1 22 70" fill="none" />
  </defs>

  <g opacity="0.75">
    <!-- Outer dashed/textured border -->
    <ellipse cx="89.5" cy="70" rx="84" ry="63" stroke="#2F4156" stroke-width="1.5" stroke-dasharray="4 3" />
    
    <!-- Outer solid thin ring -->
    <ellipse cx="89.5" cy="70" rx="80" ry="59" stroke="#2F4156" stroke-width="1.8" />
    
    <!-- Inner solid ring -->
    <ellipse cx="89.5" cy="70" rx="55" ry="38" stroke="#2F4156" stroke-width="1.2" />

    <!-- Top Curved Text -->
    <text font-family="'Dream Orphans', 'Afacad Flux', -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="3.2" fill="#2F4156">
      <textPath href="#stampArcTop" startOffset="50%" text-anchor="middle">
        • AURA CONCIERGE •
      </textPath>
    </text>

    <!-- Bottom Curved Text -->
    <text font-family="'Dream Orphans', 'Afacad Flux', -apple-system, sans-serif" font-size="8" font-weight="700" letter-spacing="2.8" fill="#2F4156">
      <textPath href="#stampArcBottom" startOffset="50%" text-anchor="middle">
        ★ VIP EXPERIENCES ★
      </textPath>
    </text>

    <!-- Center Monogram / Star Badge -->
    <g transform="translate(89.5, 70)">
      <!-- Star 1 -->
      <polygon points="0,-18 3.5,-9 13,-9 5.5,-3 8.5,6 0,0.5 -8.5,6 -5.5,-3 -13,-9 -3.5,-9" fill="#2F4156" opacity="0.4" transform="scale(0.55)" />
      
      <!-- Script Logo text in center -->
      <text y="4" text-anchor="middle" font-family="'Kaushan Script', cursive, sans-serif" font-size="19" font-weight="bold" fill="#2F4156" letter-spacing="0.5">Aura</text>
      
      <!-- Small subtitle -->
      <text y="16" text-anchor="middle" font-family="'Dream Orphans', 'Afacad Flux', sans-serif" font-size="5.5" font-weight="700" letter-spacing="2.2" fill="#2F4156">AUTHENTIC</text>
    </g>
  </g>
</svg>